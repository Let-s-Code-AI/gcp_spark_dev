name: Codex Terraform Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "terraform/**"
      - ".codex/agents/terraform-reviewer.toml"
      - ".github/workflows/codex-terraform-review.yml"

concurrency:
  group: codex-terraform-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── 1. Review: Codex uruchamia subagenta terraform_reviewer (read-only) ────
  review:
    name: Codex review
    runs-on: ubuntu-latest
    # PR-y z forków nie mają dostępu do sekretów — pomijamy je.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Checkout (merge commit PR-a)
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      # Agent trafia też do CODEX_HOME, żeby był widoczny niezależnie od tego,
      # czy Codex uzna katalog repo za zaufany projekt.
      - name: Install custom agents
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home/agents"
          cp .codex/agents/*.toml "$RUNNER_TEMP/codex-home/agents/"

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          sandbox: read-only
          safety-strategy: drop-sudo
          output-file: codex-review.md
          prompt: |
            This checkout is the merge commit of a pull request, so
            `git diff HEAD^1 HEAD` is exactly what the pull request changes.

            Spawn the `terraform_reviewer` agent and have it review
            `git diff HEAD^1 HEAD -- terraform/`. Wait for it to finish.

            Your final message must be the agent's review, verbatim, with no
            introduction or commentary of your own. Do not modify any files.

  # ── 2. Komentarz w PR (osobny job — tylko on ma prawo zapisu) ──────────────
  comment:
    name: Post review comment
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.final_message != ''
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Create or update review comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ needs.review.outputs.final_message }}
        with:
          script: |
            const marker = '<!-- codex-terraform-review -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n## Codex: review Terraform\n\n${process.env.REVIEW}\n\n<sub>Commit ${sha}</sub>`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
